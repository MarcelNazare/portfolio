root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags sqlite -o ./tmp/main.exe ."
  entrypoint = ["./tmp/main.exe"]
  include_ext = ["go", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "uploads", "static", "migrations"]
  delay = 1000

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"