{{define "admin_post_edit.html"}}{{template "admin_head" .}}
{{with .Post}}
<div class="flex justify-between items-center mb-6">
  <div>
    <a href="/admin/posts" class="text-sm text-on-surface-variant hover:text-primary">← Back to posts</a>
    <h1 class="font-serif text-3xl font-bold mt-2">{{if $.IsNew}}New post{{else}}Edit post{{end}}</h1>
  </div>
  {{if not $.IsNew}}
  <a href="/blog/{{.Slug}}" target="_blank" class="text-sm text-on-surface-variant hover:text-primary">View live ↗</a>
  {{end}}
</div>

<div id="flash"></div>

<form hx-post="{{if $.IsNew}}/admin/posts{{else}}/admin/posts/{{.ID}}{{end}}"
      hx-target="#flash" hx-swap="innerHTML"
      class="grid grid-cols-1 lg:grid-cols-3 gap-6">

  <div class="lg:col-span-2 space-y-6">
    <div class="bg-white rounded-xl border border-outline-variant/20 p-6 space-y-4">
      <label class="block">
        <span class="text-sm font-semibold">Title</span>
        <input id="title" name="title" required value="{{.Title}}" class="mt-1 w-full px-3 py-2 border border-outline-variant/40 rounded-lg focus:border-primary focus:outline-none">
      </label>
      <label class="block">
        <span class="text-sm font-semibold">Slug</span>
        <input id="slug" name="slug" required value="{{.Slug}}" data-auto="{{if $.IsNew}}true{{else}}false{{end}}" class="mt-1 w-full px-3 py-2 border border-outline-variant/40 rounded-lg font-mono text-sm focus:border-primary focus:outline-none">
      </label>
      <label class="block">
        <span class="text-sm font-semibold">Excerpt</span>
        <textarea name="excerpt" rows="3" required class="mt-1 w-full px-3 py-2 border border-outline-variant/40 rounded-lg focus:border-primary focus:outline-none">{{.Excerpt}}</textarea>
      </label>
    </div>

    <div class="bg-white rounded-xl border border-outline-variant/20 p-6">
      <label class="block">
        <span class="text-sm font-semibold">Post body (Markdown)</span>
        <textarea id="body-editor" name="body_markdown" rows="24" class="mt-1 w-full">{{.BodyMarkdown}}</textarea>
      </label>
    </div>
  </div>

  <div class="space-y-6">
    <div class="bg-white rounded-xl border border-outline-variant/20 p-6 space-y-4">
      <label class="block">
        <span class="text-sm font-semibold">Published date</span>
        <input type="date" name="published_at" required value="{{.PublishedAt.Format "2006-01-02"}}" class="mt-1 w-full px-3 py-2 border border-outline-variant/40 rounded-lg">
      </label>
    </div>

    <div class="bg-white rounded-xl border border-outline-variant/20 p-6 space-y-3">
      <label class="block">
        <span class="text-sm font-semibold">Hero image URL</span>
        <input name="image_url" value="{{.ImageURL}}" placeholder="/uploads/foo.webp" class="mt-1 w-full px-3 py-2 border border-outline-variant/40 rounded-lg text-sm">
      </label>
      <label class="block cursor-pointer">
        <span class="text-xs text-on-surface-variant">Upload an image:</span>
        <input type="file" id="image-upload" accept="image/*" class="mt-1 w-full text-xs">
      </label>
      {{if .ImageURL}}<img src="{{.ImageURL}}" alt="" class="w-full rounded-lg border border-outline-variant/20">{{end}}
    </div>

    <div class="bg-white rounded-xl border border-outline-variant/20 p-6">
      <button type="submit" class="w-full bg-primary text-on-primary py-3 rounded-lg font-semibold hover:bg-primary-dim transition">
        {{if $.IsNew}}Publish post{{else}}Save changes{{end}}
      </button>
    </div>
  </div>
</form>

<link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
<script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const title = document.getElementById('title');
  const slug  = document.getElementById('slug');
  if (title && slug) {
    title.addEventListener('input', () => {
      if (slug.dataset.auto === 'true') {
        slug.value = title.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
      }
    });
    slug.addEventListener('input', () => { slug.dataset.auto = 'false'; });
  }

  const easyMDE = new EasyMDE({
    element: document.getElementById('body-editor'),
    uploadImage: true,
    imageUploadEndpoint: '/admin/upload',
    imagePathAbsolute: false,
    spellChecker: false,
    autoDownloadFontAwesome: true,
    toolbar: ['bold','italic','heading','|','quote','unordered-list','ordered-list','|',
              'link','image','upload-image','|','preview','side-by-side','fullscreen','|','guide'],
    status: ['lines','words'],
  });

  document.body.addEventListener('htmx:configRequest', () => {
    if (easyMDE && easyMDE.codemirror) easyMDE.codemirror.save();
  });

  const uploadInput = document.getElementById('image-upload');
  if (uploadInput) {
    uploadInput.addEventListener('change', async () => {
      const file = uploadInput.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('image', file);
      const res = await fetch('/admin/upload', { method: 'POST', body: fd });
      if (res.ok) {
        const { data } = await res.json();
        const urlInput = document.querySelector('input[name="image_url"]');
        if (urlInput) urlInput.value = data.filePath;
      }
    });
  }
});
</script>
{{end}}
{{template "admin_footer" .}}{{end}}
