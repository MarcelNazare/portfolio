{{define "project_card"}}
<a href="/projects/{{.Slug}}" class="group bg-surface-container-low p-8 rounded-xl hover:bg-white transition-all duration-500 hover:shadow-2xl hover:shadow-primary/5 border border-transparent hover:border-primary/10 block">
  {{if .ImageURL}}<img src="{{.ImageURL}}" alt="" class="w-full aspect-video object-cover rounded-lg mb-6">{{end}}
  {{if .ImpactMetric}}
  <div class="inline-block px-3 py-1 bg-primary-container text-on-primary-container rounded-full text-xs font-mono font-semibold mb-4">{{.ImpactMetric}}</div>
  {{end}}
  <h3 class="text-2xl font-bold font-serif mb-3 group-hover:text-primary transition-colors">{{.Title}}</h3>
  <p class="text-on-surface-variant leading-relaxed mb-6">{{.Tagline}}</p>
  <div class="flex flex-wrap gap-2">
    {{range .Tools}}<span class="px-3 py-1 bg-secondary-fixed-dim text-on-secondary-fixed-variant rounded-full text-xs font-medium">{{.}}</span>{{end}}
  </div>
</a>
{{end}}
